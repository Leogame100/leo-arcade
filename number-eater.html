<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>数字吞噬 · Number Eater</title>
<style>
  :root{ --ink:#eef4ff; --muted:#93a0c4; --line:#26305a; --gold:#ffcf3a; --green:#31e07a; --red:#ff5b6e; --blue:#4a90ff; --mag:#c46bff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#070a16;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%;}
  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:8px 10px;pointer-events:none;gap:8px;}
  .panel{background:rgba(12,16,34,.72);border:1px solid var(--line);border-radius:12px;padding:7px 11px;backdrop-filter:blur(4px);}
  #bignum{font-family:ui-monospace,monospace;font-weight:900;font-size:26px;line-height:1;color:#fff;text-shadow:0 0 14px rgba(74,144,255,.5);}
  #bigsub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700;}
  .lvpill{display:inline-block;background:var(--blue);color:#04122e;font-weight:900;font-size:11px;padding:1px 7px;border-radius:7px;}
  #rightHud{text-align:right;font-size:12px;font-weight:800;line-height:1.6;}
  #rightHud .co{color:var(--gold);} #rightHud .bt{color:var(--muted);font-weight:700;}
  #combo{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-family:ui-monospace,monospace;font-weight:900;
    font-size:34px;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;transition:opacity .15s, transform .15s;pointer-events:none;}
  #combo.show{opacity:1;}
  /* skills */
  #skills{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:auto;}
  .sk{width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:rgba(14,18,38,.85);position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
  .sk:active{transform:scale(.93);} .sk .si{font-size:24px;line-height:1;} .sk .sn{font-size:9px;font-weight:800;margin-top:1px;}
  .sk .cool{position:absolute;left:0;bottom:0;width:100%;background:rgba(0,0,0,.55);pointer-events:none;}
  .sk.ready{border-color:var(--green);box-shadow:0 0 12px -2px var(--green);}
  .sk.active{border-color:var(--gold);box-shadow:0 0 14px -1px var(--gold);}
  /* corner buttons */
  #corner{position:fixed;bottom:16px;right:10px;display:flex;flex-direction:column;gap:7px;pointer-events:auto;}
  .cbtn{background:rgba(14,18,38,.85);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:18px;padding:7px 10px;cursor:pointer;}
  #topleftBtns{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:none;}
  /* overlays */
  .ov{position:fixed;inset:0;background:radial-gradient(700px 460px at 50% 20%,#131a3a,#070a16 70%);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  /* 职业太多：把卡片限制在屏内，让职业列表自己上下滑动 */
  #classOv .card{max-height:calc(100vh - 36px);display:flex;flex-direction:column;}
  #classList{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:4px;}
  .ov.hidden{display:none;}
  .card{width:100%;max-width:440px;text-align:center;}
  .card h1{font-size:34px;margin:0 0 4px;font-weight:900;background:linear-gradient(90deg,#7fd0ff,#c46bff,#ffcf3a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;}
  .card .en{color:var(--muted);font-size:13px;margin-bottom:14px;letter-spacing:2px;}
  .card p{color:var(--muted);font-size:13px;line-height:1.7;margin:8px 0;}
  .modes{display:grid;gap:9px;margin:14px 0;}
  .mode{background:rgba(18,24,52,.8);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .1s,transform .05s;}
  .mode:active{transform:scale(.98);} .mode:hover{border-color:var(--blue);}
  .mode .mi{font-size:26px;} .mode .mt{flex:1;} .mode .mn{font-weight:900;font-size:15px;} .mode .md{font-size:11px;color:var(--muted);margin-top:2px;}
  .mode.pri{border-color:var(--gold);background:linear-gradient(135deg,#241f0e,#141a3a);box-shadow:0 0 0 1px var(--gold);}
  .stat{display:flex;justify-content:center;gap:18px;margin:12px 0;font-size:13px;}
  .stat b{color:var(--gold);font-family:ui-monospace,monospace;}
  .board{background:rgba(12,16,34,.7);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;text-align:left;font-size:12px;}
  .board .br{display:flex;justify-content:space-between;padding:2px 0;} .board .br b{color:var(--gold);font-family:ui-monospace,monospace;}
  .btn{border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:900;cursor:pointer;width:100%;color:#04122e;background:linear-gradient(180deg,#7fd0ff,#4a90ff);box-shadow:0 4px 0 #2b5cab;margin-top:4px;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b5cab;}
  .foot{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:#4a5480;pointer-events:none;}
  .tiny{background:rgba(14,18,38,.85);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:12px;font-weight:800;padding:6px 11px;cursor:pointer;}
  #langBtn{position:fixed;top:8px;right:10px;z-index:22;}
</style>

<!-- start -->

</div>

<script>
"use strict";
/* ==================== i18n ==================== */
let LANG=(function(){try{return localStorage.getItem("neLang")||"zh";}catch(e){return "zh";}})();
const TR={
  "数字吞噬":"Number Eater","冲刺":"Dash","磁铁":"Magnet","护盾":"Shield",
  "控制你的数字，吞噬比你小的数字不断变大——别碰比你大的！":"Steer your number, eat smaller ones to grow — never touch a bigger one!",
  "拖动移动 · 空格或长按=加速 · 技能键 1/2/3":"Drag to move · Space / long-press = sprint · skills 1/2/3",
  "历史最大":"Best","金币":"Coins","拖动/鼠标移动 · 技能键 1/2/3 或点按钮 · 虚拟娱乐":"Drag / move mouse · skills 1/2/3 or tap · for fun only",
  "被吞噬了！":"EATEN!","最终数字":"Final number","等级":"Level","吞噬":"Eaten","最高连击":"Best combo","新纪录！":"NEW RECORD!","再来一局":"Play Again",
  "经典模式":"Classic","能量模式":"Energy","生存模式":"Survival",
  "吃比自己小的+1，靠连击与Boss暴涨":"Eat smaller = +1; combos & bosses skyrocket you",
  "吸收被吃数字的一半，成长飞快":"Absorb half of what you eat — grow fast",
  "毒圈不断缩小，圈外掉数字，活到最后":"The safe ring shrinks; outside drains you — survive",
  "新手":"Rookie","学徒":"Apprentice","高手":"Skilled","大师":"Master","宗师":"Grandmaster","传奇":"Legend","神话":"Mythic","超越":"Transcendent",
  "排行榜":"Leaderboard","暂无记录":"No records yet","连击":"COMBO",
  "⚡ 冲刺！":"⚡ Dash!","🧲 磁铁！":"🧲 Magnet!","🛡️ 护盾就绪":"🛡️ Shield armed","🛡️ 护盾挡下一击！":"🛡️ Shield saved you!","技能冷却中":"On cooldown",
  "💥 炸弹！掉了一截":"💥 Bomb! shrank","❄️ 冰冻！":"❄️ Freeze!","👑 双倍金币":"👑 Double coins","⭐ 升级！":"⭐ Level up!","💀 击败Boss！":"💀 Boss down!","🎁 宝箱":"🎁 Chest",
  "暂停中":"Paused","继续":"Resume","选择地图大小":"Choose map size",
  "隐藏房间":"Hidden Room","小地图":"Map","快离开！":"GET OUT!",
  "隐藏房间出现！沿箭头前往，里面全是食物":"Hidden room open! Follow the arrow — it's full of food",
  "隐藏房间即将关闭，快离开！":"Room is closing — get out!","被困在隐藏房间！":"Trapped in the room!",
  // 🦠 病毒模式
  "病毒模式":"Virus","末日丧尸：躲避感染、抢解药、进隔离带，选职业求生":"Zombie apocalypse: dodge infection, grab cures, reach quarantine — pick a class",
  "选择职业":"Choose a Class","隔离带":"Quarantine","感染中":"infected","存活":"Survived","你变成了丧尸！":"YOU TURNED INTO A ZOMBIE!",
  "隔离带出现！20秒内进去回血":"Quarantine open! 20s to heal inside","隔离带关闭了":"Quarantine closed","解药！变回人类·满血":"Cure! Back to human, full HP",
  "普通人":"Civilian","运动员":"Athlete","医生":"Doctor","军人":"Soldier","科学家":"Scientist","幸存者":"Survivor",
  "警察":"Police","士兵":"Trooper","猎人":"Hunter","消防员":"Firefighter","忍者":"Ninja","神父":"Priest",
  "均衡：解药免疫更久":"Balanced · longer cure immunity","移动速度 +25%":"Move speed +25%","感染掉血减半":"Infection drains 50% slower",
  "吃解药后 8 秒免疫":"8s immunity after a cure","解药更常出现·小地图显示丧尸":"More cures · zombies on minimap","血量上限 150":"Max HP 150",
  "数字>6 可击杀丧尸":"Kill zombies when your number >6","可击杀丧尸(>6)·移速略快":"Kills zombies (>6) · a bit faster","可击杀丧尸(>6)·小地图显示丧尸":"Kills zombies (>6) · zombies on minimap",
  "免疫尾迹感染":"Immune to trail infection","移动速度 +35%":"Move speed +35%","血上限120·感染掉血 -30%":"120 max HP · infection −30%",
  "建筑师":"Architect","放置方形/长方形障碍墙，挡住丧尸":"Places square/rectangle walls to block zombies","砖块不足，等它回充":"Out of bricks — wait for recharge",
  "你变成了丧尸！去感染所有人类":"You turned into a zombie — go infect everyone!","你被消灭了":"YOU WERE DESTROYED","全城沦陷！你赢了":"CITY OVERRUN — YOU WIN!","丧尸":"Zombie",
  "人类职业（求生）":"Human classes (survive)","丧尸职业（感染全城）":"Zombie classes (infect all)",
  "普通丧尸":"Walker","疾行丧尸":"Runner","巨型丧尸":"Brute","剧毒丧尸":"Toxic","潜伏丧尸":"Stalker","尸王":"Zombie King",
  "均衡":"Balanced","速度快·血略少":"Fast · slightly less HP","血超厚·较慢":"Huge HP · slower","范围感染":"Ranged infection","速度较快":"Faster","血王·范围感染":"Max HP · ranged infection",
  "🏆 霸屏！你统治了全屏":"🏆 SCREEN DOMINATED — YOU WIN!",
};
function tr(s){ return LANG==="en"?(TR[s]||s):s; }
function applyLang(){ document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr(el.getAttribute("data-i18n")));
  document.getElementById("langBtn").textContent=LANG==="en"?"中":"EN"; buildMapSel(); buildModes(); buildClasses(); renderBoard(); if(G) hud(); }
function toggleLang(){ LANG=LANG==="en"?"zh":"en"; try{localStorage.setItem("neLang",LANG);}catch(e){} applyLang(); }

/* ==================== 数字格式化（近乎无限）==================== */
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd"];
function fmt(n){ if(!isFinite(n)) return "∞"; n=Math.floor(n);
  if(n<10000) return n.toLocaleString("en-US");
  let u=0, x=n; while(x>=1000 && u<SUF.length-1){ x/=1000; u++; }
  if(u>=SUF.length-1 && x>=1000) return n.toExponential(2).replace("e+","e");
  return (x<100?x.toFixed(2):x<1000?x.toFixed(1):Math.floor(x)).replace(/\.?0+$/,"")+SUF[u]; }

/* ==================== 常量 ==================== */
let WORLD_W=2600, WORLD_H=1900;   // 由所选地图大小设定
const MAP_SIZES=[
  {id:"s", zh:"小", en:"S", w:1700, h:1250},
  {id:"m", zh:"中", en:"M", w:2600, h:1900},
  {id:"l", zh:"大", en:"L", w:4200, h:3000},
  {id:"xl",zh:"超大", en:"XL", w:6400, h:4600},
];
let mapSizeId=(function(){try{return localStorage.getItem("neMap")||"m";}catch(e){return "m";}})();
function applyMapSize(id){ const m=MAP_SIZES.find(x=>x.id===id)||MAP_SIZES[1]; WORLD_W=m.w; WORLD_H=m.h; mapSizeId=m.id; try{localStorage.setItem("neMap",m.id);}catch(e){} }
const TIERS=[10,30,60,100,300,1000,3000,1e4,3e4,1e5,3e5,1e6,1e8,1e12];
const LV_NAMES=["新手","新手","学徒","高手","大师","宗师","传奇","神话","超越"];
function levelOf(v){ let lv=1; for(const t of TIERS){ if(v>t) lv++; else break; } return lv; }
function lvName(lv){ return LV_NAMES[Math.min(lv, LV_NAMES.length-1)]; }
// 数字越大体积越大（更陡的成长 + 更高上限），大数字会「霸屏」
function radiusOf(v, boss){ let r=16+27*Math.log10(v+1); r=Math.min(r, 210); return boss? r*1.5 : r; }
const BASU_RADIUS=190, FIXED_ZOOM=1;   // 霸屏胜利：身体半径达 190 即填满全屏；固定缩放（视野不随数字变大）
const SKILLS={ dash:{cd:4}, magnet:{cd:12}, shield:{cd:20} };
// 引力（高强度）：力 ∝ 大小差/(和)，越大引力越强，大小相近则抵消；大的把小的吸过来，你也会被更大的拉过去。
const GRAV={ range:720, pull:480, suck:520 };
const EAT_PCT={ classic:0.75, energy:0.90, survive:0.75 };   // 吃数字时吸收对方数值的比例
const HURT_INTERVAL=0.7, HURT_LOSS=0.30;                     // 碰到更大数字：每0.7秒-30%（不立即死）
const BOT_SPEED_MUL=0.6;         // 其他数字速度 -40%
const OFFSCREEN_DESPAWN=4;       // 离开视野 4 秒后消失
const FOOD_TYPES=[               // 食物：吃到即按倍率暴涨（高倍更稀有）
  {mult:1.2,label:"+20%",col:"#7fd0ff",w:34},{mult:1.5,label:"+50%",col:"#31e07a",w:24},{mult:1.8,label:"+80%",col:"#ffcf3a",w:16},
  {mult:2,label:"×2",col:"#ff9f3a",w:10},{mult:3,label:"×3",col:"#c46bff",w:5},{mult:5,label:"×5",col:"#ff5b6e",w:2},
];
const FOOD_W=FOOD_TYPES.reduce((s,f)=>s+f.w,0);
const ROOM_INTERVAL=250, ROOM_DURATION=120, ROOM_WARN=12;   // 每250秒开隐藏房间，持续120秒，最后12秒警告
const SPAWN_RATE=1.05;           // 其他数字刷新速度（再 -50%）
const SPRINT_MUL=1.7;            // 加速键（空格/长按）
const SPEED_BOOST=1.8, BOOST_DUR=2;   // 加速方块：+80% 速度，续 2 秒
const BOMB_MINUS=50, BOMB_R=280;      // 爆炸方块：附近数字 -50
// 🦠 病毒模式
const VIRUS_DRAIN=2.5, TRAIL_LIFE=3, TRAIL_INFECT=2, QUARANTINE_AT=50, ZOMBIE_SPEED=1.8, QUARANTINE_DUR=20;

/* ==================== 生成/AI ==================== */
function spawnBot(force){ if(!G) return; const p=G.player;
  const ang=Math.random()*Math.PI*2, dist=(force?120:300)+Math.random()*560;
  let x=clamp(p.x+Math.cos(ang)*dist,20,WORLD_W-20), y=clamp(p.y+Math.sin(ang)*dist,20,WORLD_H-20);
  let val, kind="normal", boss=false;
  // 出现范围随玩家数字：[⌊v/2⌋, v+3]（2→1-5，3→1-6，4→2-7，5→2-8 …），多为可吃的小数字
  const v=p.val, lo=Math.max(1,Math.floor(v/2)), hi=v+3;
  if(Math.random()<0.014 && G.time>7){ boss=true; val=Math.max(10,Math.round(v*(2.4+Math.random()*4.5))); }
  else if(Math.random()<0.68 && v>lo){ val=lo+Math.floor(Math.random()*(v-lo)); }   // [lo, v-1] 可吃
  else { val=clamp(v+Math.floor(Math.random()*(hi-v+1)), lo, hi); }                    // [v, hi]
  if(!boss && val<p.val){ const s=Math.random();
    if(s<0.03) kind="rainbow"; else if(s<0.085) kind="gold"; else if(s<0.10){ kind="lucky7"; val=7; }
    else if(s<0.125) kind="bomb"; else if(s<0.145) kind="crown"; else if(s<0.163) kind="freeze"; }
  G.bots.push({val,x,y,vx:0,vy:0,kind,boss,r:radiusOf(val,boss),t:Math.random()*3,dir:Math.random()*Math.PI*2});
}
function infectBot(b){ b.zombie=true; b.fighter=false; const z=ZCLASSES[Math.floor(Math.random()*ZCLASSES.length)];   // 其他丧尸也随机有职业
  b.zcls=z.id; b.zspd=z.spd; b.infR=z.infR||0; b.hp=100*ZOMBIE_HP_MUL*z.hp; b.inf=false; }
function applyZClass(g, zid){ const z=ZCLASSES.find(x=>x.id===zid)||ZCLASSES[0]; g.zcls=z.id; g.zspd=z.spd; g.zInfR=z.infR||0; g.zMax=100*ZOMBIE_HP_MUL*z.hp; g.hp=g.zMax; }
function turnPlayerZombie(zid){ G.zombie=true; G.infected=false; G.player.trailT=0; G.fighter=false; applyZClass(G, zid||ZCLASSES[Math.floor(Math.random()*ZCLASSES.length)].id);
  toast("🧟 "+tr("你变成了丧尸！去感染所有人类")); }
function assignZombieTargets(){   // 每只丧尸锁定最近的人类；若已被别的丧尸锁定则退而求其次（第2近…）
  const humans=[], zombies=[]; for(const b of G.bots){ if(b.zombie) zombies.push(b); else humans.push(b); }
  const includeP=!G.zombie;   // 玩家是人类时也可被锁定
  const claimed=new Set();
  for(const z of zombies){ let best=null,bestD=Infinity,fb=null,fbD=Infinity;
    for(const h of humans){ const d=hyp(h.x-z.x,h.y-z.y); if(d<fbD){fbD=d;fb=h;} if(!claimed.has(h)&&d<bestD){bestD=d;best=h;} }
    if(includeP){ const p=G.player,d=hyp(p.x-z.x,p.y-z.y); if(d<fbD){fbD=d;fb="P";} if(!claimed.has("P")&&d<bestD){bestD=d;best="P";} }
    const t=(best!=null)?best:fb; z.tgt=t; if(t!=null) claimed.add(t); }
}
function seedVirusPeople(noPZ){ G.bots=[];   // 开局 250 人散布全图，人类永久存在
  for(let i=0;i<250;i++){ const x=60+Math.random()*(WORLD_W-120), y=60+Math.random()*(WORLD_H-120), val=2+Math.floor(Math.random()*7);
    G.bots.push({val,x,y,vx:0,vy:0,kind:"normal",boss:false,r:radiusOf(val),t:Math.random()*3,dir:Math.random()*Math.PI*2,zombie:false,fighter:Math.random()<0.12,hp:100,inf:false}); }
  if(!noPZ && G.bots.length) infectBot(G.bots[Math.floor(Math.random()*G.bots.length)]);   // 零号感染者
}
function ensureBots(){
  if(G.mode==="virus") return;   // 病毒模式人口固定、永久存在，不刷新
  // 离开玩家视野 4 秒后消失（去房间/在房间里的除外）
  const v=G.view;
  for(let i=G.bots.length-1;i>=0;i--){ const b=G.bots[i];
    if(b.toRoom||isInRoom(b)||b.zombie){ b.offT=0; continue; }   // 丧尸不消失
    const off=(b.x<v.x0||b.x>v.x1||b.y<v.y0||b.y>v.y1);
    b.offT=off?(b.offT||0)+(G._dt||0.016):0;
    if(b.offT>OFFSCREEN_DESPAWN){ G.bots.splice(i,1); }
  }
  const want=40; let guard=0;
  if(G.time<0.5){ while(G.bots.length<want && guard++<80) spawnBot(); }   // 开局补满
  else { G.spawnAcc=(G.spawnAcc||0)+SPAWN_RATE*(G._dt||0.016);            // 之后按 -65% 的速度慢慢刷新
    while(G.bots.length<want && G.spawnAcc>=1 && guard++<8){ spawnBot(); G.spawnAcc-=1; } }
}

  if(hyp(G.player.x-x,G.player.y-y)<BOMB_R){ G.player.val=Math.max(1,G.player.val-BOMB_MINUS); G.player.r=radiusOf(G.player.val); }
  for(const b of G.bots){ if(hyp(b.x-x,b.y-y)<BOMB_R){ b.val=Math.max(1,b.val-BOMB_MINUS); b.r=radiusOf(b.val,b.boss); } }
  popup(x,y,"💥 -"+BOMB_MINUS,"#ff5b6e"); }

function placeObstacle(shape){ if(!G||G.over||G.paused||!G.architect) return; if((G.bricks||0)<1){ toast(tr("砖块不足，等它回充")); return; }
  const p=G.player; let dx=p.vx, dy=p.vy, dl=hyp(dx,dy); if(dl<1){ dx=1; dy=0; } else { dx/=dl; dy/=dl; }
  let hw,hh; if(shape==="square"){ hw=46; hh=46; } else { if(Math.abs(dx)>=Math.abs(dy)){ hw=28; hh=94; } else { hw=94; hh=28; } }   // 长墙垂直于前进方向
  const off=p.r+Math.max(hw,hh)+8;
  const o={cx:clamp(p.x+dx*off,hw,WORLD_W-hw), cy:clamp(p.y+dy*off,hh,WORLD_H-hh), hw, hh};
  G.obstacles.push(o); if(G.obstacles.length>18) G.obstacles.shift();
  G.bricks--; popup(o.cx,o.cy,"🧱","#c8d0e8"); }
function collideObstacles(e){ if(!G.obstacles||!G.obstacles.length) return; for(const o of G.obstacles){
    const nx=clamp(e.x,o.cx-o.hw,o.cx+o.hw), ny=clamp(e.y,o.cy-o.hh,o.cy+o.hh), dx=e.x-nx, dy=e.y-ny, d2=dx*dx+dy*dy;
    if(d2 < e.r*e.r){
      if(d2>0.01){ const d=Math.sqrt(d2), push=e.r-d; e.x+=dx/d*push; e.y+=dy/d*push; }
      else { const L=e.x-(o.cx-o.hw), Rr=(o.cx+o.hw)-e.x, T=e.y-(o.cy-o.hh), B=(o.cy+o.hh)-e.y, m=Math.min(L,Rr,T,B);
        if(m===L) e.x=o.cx-o.hw-e.r; else if(m===Rr) e.x=o.cx+o.hw+e.r; else if(m===T) e.y=o.cy-o.hh-e.r; else e.y=o.cy+o.hh+e.r; }
    } } }
/* -------- 🦠 病毒模式 -------- */
function virusStep(dt){ const p=G.player; G.survTime=(G.survTime||0)+dt;
  // 隔离带：只持续 20 秒，关闭后 30 秒再出现
  if(!G.quarantine && G.time>=G.quarantineAt){ const qr=Math.min(WORLD_W,WORLD_H)*0.17;
    G.quarantine={x:clamp(p.x,qr+40,WORLD_W-qr-40),y:clamp(p.y,qr+40,WORLD_H-qr-40),r:qr,closeAt:G.time+QUARANTINE_DUR}; toast("🛡️ "+tr("隔离带出现！20秒内进去回血")); }
  if(G.quarantine && G.time>=G.quarantine.closeAt){ G.quarantine=null; G.quarantineAt=G.time+30; toast("🛡️ "+tr("隔离带关闭了")); }
  const Q=G.quarantine, inQ=!!(Q && !G.zombie && hyp(p.x-Q.x,p.y-Q.y)<Q.r-p.r*0.4), immune=(G.time<G.cureImmuneUntil)||inQ;
  const fighter=G.fighter && p.val>6;   // 士兵/警察/猎人：数字>6可攻击丧尸

  if(!G.zombie){   // ===== 玩家是人类 =====
    let zTouch=false;
    for(let i=G.bots.length-1;i>=0;i--){ const b=G.bots[i]; if(!b.zombie) continue; if(hyp(b.x-p.x,b.y-p.y) < p.r+b.r*0.9){
      if(fighter){ b.hp=(b.hp||100)-FIGHTER_DPS*dt; if(b.hp<=0){ G.bots.splice(i,1); popup(b.x,b.y,"💥","#ffcf3a"); } } else if(!G.fighter) zTouch=true; } }   // 士兵职业免疫感染
    if(zTouch && !immune) G.infected=true;
    let onTrail=false; for(const t of G.trails){ if(hyp(t.x-p.x,t.y-p.y) < p.r+t.r){ onTrail=true; break; } }
    if(onTrail && !immune && !G.trailImmune && !G.fighter){ p.trailT=(p.trailT||0)+dt; if(p.trailT>=TRAIL_INFECT) G.infected=true; } else p.trailT=Math.max(0,(p.trailT||0)-dt);
    if(inQ){ G.infected=false; G.hp=Math.min(G.maxHp, G.hp+G.maxHp*0.14*dt); }
    else if(G.infected){ G.hp-=G.maxHp*(VIRUS_DRAIN/100)*G.drainMul*dt; if(G.hp<=0){ turnPlayerZombie(); } }   // 血空 → 变丧尸（不再直接结束）
  } else {          // ===== 玩家是丧尸 =====
    if(p.val>G.best) G.best=p.val;
    for(let i=G.bots.length-1;i>=0;i--){ const h=G.bots[i]; if(h.zombie) continue; const d=hyp(h.x-p.x,h.y-p.y);
      if(d < p.r+h.r*0.9 || (G.zInfR && d<G.zInfR+h.r)){ if(h.fighter){ G.hp-=FIGHTER_DPS*dt; } else h.inf=true; } }   // 感染人类（渐进掉血）；碰到士兵会掉血
    if(G.hp<=0){ G.hp=0; return gameOver("killed"); }   // 被士兵击杀才算死
    if(!G.bots.some(b=>!b.zombie)){ return gameOver("domination"); }   // 全城沦陷 → 胜利
    if(Math.random()<dt*10) G.trails.push({x:p.x,y:p.y,r:Math.max(14,p.r*0.7),t:0});   // 玩家丧尸也留尾迹
  }
  // 丧尸绿色尾迹（3秒消失）
  for(const b of G.bots){ if(b.zombie && Math.random()<dt*10) G.trails.push({x:b.x,y:b.y,r:Math.max(14,b.r*0.7),t:0}); }
  for(const t of G.trails) t.t+=dt; if(G.trails.length>600) G.trails=G.trails.slice(-600);
  if(G.trails.length && G.trails[0].t>=TRAIL_LIFE) G.trails=G.trails.filter(t=>t.t<TRAIL_LIFE);
  // 数字之间：丧尸感染人类（可范围）；碰到士兵人类 → 士兵造成伤害（丧尸互不吞噬、丧尸不因感染掉血）
  for(let i=G.bots.length-1;i>=0;i--){ const z=G.bots[i]; if(!z.zombie) continue; const rng=z.infR||0;
    for(const h of G.bots){ if(h.zombie) continue; const d=hyp(h.x-z.x,h.y-z.y);
      if(d < z.r+h.r*0.9 || (rng && d<rng+h.r)){ if(h.fighter){ z.hp=(z.hp||100)-FIGHTER_DPS*dt; if(z.hp<=0){ z.dead=true; break; } } else h.inf=true; } } }
  if(G.bots.some(x=>x.dead)) G.bots=G.bots.filter(x=>!x.dead);
  // 被咬的人类：像玩家一样每0.7秒-30%血，掉光才变丧尸（不是秒变，给反应时间）
  for(const h of G.bots){ if(h.zombie || !h.inf || h.fighter) continue; if(G.time>=(h.hurtNext||0)){ h.hurtNext=G.time+0.7; h.hp=Math.max(1,Math.floor((h.hp||100)*0.7)); if(h.hp<=1) infectBot(h); } }
  // 隔离带排斥丧尸
  if(Q){ for(const b of G.bots){ if(b.zombie){ const ddx=b.x-Q.x, ddy=b.y-Q.y, dd=hyp(ddx,ddy)||1; if(dd<Q.r+b.r){ const push=(Q.r+b.r-dd); b.x+=ddx/dd*push; b.y+=ddy/dd*push; } } } }
  // 解药：玩家(人类)吃→回人满血；丧尸吃→变回人类
  if(Math.random()<0.010*G.cureRateMul && G.cures.length<3) G.cures.push({x:60+Math.random()*(WORLD_W-120),y:60+Math.random()*(WORLD_H-120),r:18});
  for(let i=G.cures.length-1;i>=0;i--){ const c=G.cures[i];
    if(!G.zombie && hyp(c.x-p.x,c.y-p.y) < p.r+c.r){ G.infected=false; p.trailT=0; G.hp=G.maxHp; G.cureImmuneUntil=G.time+G.cureImmuneDur; G.cures.splice(i,1); popup(c.x,c.y,"💊","#31e07a"); toast("💊 "+tr("解药！变回人类·满血")); continue; }
    let eaten=false; for(const b of G.bots){ if(b.zombie && hyp(c.x-b.x,c.y-b.y) < b.r+c.r){ b.zombie=false; b.hp=100; b.inf=false; b.hurtNext=0; b.zcls=null; b.infR=0; eaten=true; break; } }
    if(eaten) G.cures.splice(i,1);
  }
}

function pickFood(){ let r=Math.random()*FOOD_W; for(const f of FOOD_TYPES){ r-=f.w; if(r<0) return f; } return FOOD_TYPES[0]; }
function addFood(x,y,inRoom){ const f=pickFood(); G.foods.push({x,y,mult:f.mult,label:f.label,col:f.col,r:14+(f.mult>=2?6:0),room:!!inRoom}); }
function isInRoom(e){ const R=G.room; return !!(R&&R.active&&e.x>WORLD_W && e.y>=R.y0 && e.y<=R.y1); }
function clampEntity(e,m){ const R=G.room, gap=R&&R.active && e.y>=R.y0 && e.y<=R.y1;
  const xmax=gap?R.x1-m:WORLD_W-m; e.x=clamp(e.x,m,xmax);
  if(R&&R.active && e.x>WORLD_W){ e.y=clamp(e.y,R.y0+m,R.y1-m); } else e.y=clamp(e.y,m,WORLD_H-m); }
function openRoom(){ const rw=Math.round(WORLD_W*0.5), rh=Math.round(WORLD_H*0.5);
  const y0=clamp(Math.round(G.player.y-rh/2),20,Math.max(20,WORLD_H-rh-20));
  G.room={active:true,x0:WORLD_W,x1:WORLD_W+rw,y0,y1:y0+rh,cx:WORLD_W+rw/2,cy:y0+rh/2,closeAt:G.time+ROOM_DURATION};
  G.roomWarned=false;
  for(let i=0;i<38;i++) addFood(WORLD_W+24+Math.random()*(rw-48), y0+24+Math.random()*(rh-48), true);
  for(const b of G.bots){ if(Math.random()<0.30) b.toRoom=true; }   // 30% 的数字前往房间
  toast("🚪 "+tr("隐藏房间出现！沿箭头前往，里面全是食物"));
}
function roomTick(){
  if(!G.room && G.time>=G.roomNextAt){ openRoom(); G.roomNextAt+=ROOM_INTERVAL; }
  if(G.room && G.room.active){ const R=G.room, left=R.closeAt-G.time;
    if(left<=ROOM_WARN && isInRoom(G.player) && (!G.roomWarned || G.time>=G.roomWarned)){ G.roomWarned=G.time+3; toast("⚠️ "+tr("隐藏房间即将关闭，快离开！")+" "+Math.ceil(left)+"s"); }
    if(G.time>=R.closeAt){
      if(isInRoom(G.player)){ return gameOver("room"); }             // 超时还在里面 → 直接死亡
      for(const b of G.bots){ if(b.x>WORLD_W) b.x=WORLD_W-40; b.toRoom=false; }   // 其他数字出来
      G.foods=G.foods.filter(f=>!f.room); G.room=null;
    }
  }
}
function updateBot(b,dt){ const p=G.player; b.t-=dt; if(b.t<=0){ b.t=1+Math.random()*2.5; b.dir=Math.random()*Math.PI*2; }
  let ax=Math.cos(b.dir), ay=Math.sin(b.dir);
  const dx=p.x-b.x, dy=p.y-b.y, d=hyp(dx,dy)||1;
  if(G.mode==="virus"){
    if(b.zombie){
      if(b.infR){   // 范围感染丧尸（剧毒/尸王）：围猎——扑向人群密集处，靠光环成片感染
        let cx=0,cy=0,cn=0; for(const h of G.bots){ if(!h.zombie){ const ed=hyp(h.x-b.x,h.y-b.y); if(ed<820){ cx+=h.x; cy+=h.y; cn++; } } }
        if(!G.zombie){ const ed=hyp(p.x-b.x,p.y-b.y); if(ed<820){ cx+=p.x; cy+=p.y; cn++; } }
        if(cn){ const tx=cx/cn-b.x, ty=cy/cn-b.y, td=hyp(tx,ty)||1; ax=tx/td*1.7; ay=ty/td*1.7; }
        else { ax=dx/d*0.8; ay=dy/d*0.8; }
      } else {      // 普通丧尸：锁定最近人类（被抢则第2近）
        let tx=null,ty=null;
        if(b.tgt==="P" && !G.zombie){ tx=p.x; ty=p.y; }
        else if(b.tgt && b.tgt!=="P" && !b.tgt.zombie){ tx=b.tgt.x; ty=b.tgt.y; }
        if(tx!=null){ const ex=tx-b.x, ey=ty-b.y, ed=hyp(ex,ey)||1; ax=ex/ed*1.7; ay=ey/ed*1.7; }
        else { ax=dx/d*0.8; ay=dy/d*0.8; }
      }
    }
    else {   // 人类：躲丧尸 + 靠近士兵(安全) + 往人少的方向
      let ax2=0,ay2=0, sf=null,sfd=1e9, cx=0,cy=0,cn=0;
      for(const o of G.bots){ if(o===b) continue; const ex=b.x-o.x, ey=b.y-o.y, ed=hyp(ex,ey); if(ed<=0) continue;
        if(o.zombie){ if(ed<340){ ax2+=ex/ed*1.7; ay2+=ey/ed*1.7; } }
        else { if(o.fighter && ed<520 && ed<sfd){ sfd=ed; sf=o; } if(ed<200){ cx+=o.x; cy+=o.y; cn++; } } }
      if(G.zombie){ const ex=b.x-p.x,ey=b.y-p.y,ed=hyp(ex,ey); if(ed<360&&ed>0){ ax2+=ex/ed*1.7; ay2+=ey/ed*1.7; } }   // 躲玩家丧尸
      if(sf){ const ex=sf.x-b.x,ey=sf.y-b.y,ed=hyp(ex,ey)||1; ax2+=ex/ed*0.9; ay2+=ey/ed*0.9; }   // 往士兵靠
      if(cn){ const mx=cx/cn,my=cy/cn, ex=b.x-mx,ey=b.y-my, ed=hyp(ex,ey)||1; ax2+=ex/ed*0.5; ay2+=ey/ed*0.5; }   // 往人少处
      if(ax2||ay2){ ax=ax2; ay=ay2; }
    }
  }
  else if(b.toRoom && G.room && G.room.active){ const rx=G.room.cx-b.x, ry=G.room.cy-b.y, rd=hyp(rx,ry)||1; ax=rx/rd*1.7; ay=ry/rd*1.7; }
  else if(d<400){ if(b.val<p.val){ ax-=dx/d*1.5; ay-=dy/d*1.5; } else if(b.val>p.val){ ax+=dx/d*0.7; ay+=dy/d*0.7; } }
  if(G.frozenUntil>G.time){ ax*=0.03; ay*=0.03; }
  const spd=(b.boss?46:66)*(1-Math.min(0.4,Math.log10(b.val+1)*0.05))*BOT_SPEED_MUL*((b.boostUntil||0)>G.time?SPEED_BOOST:1)*(b.zombie?ZOMBIE_SPEED*(b.zspd||1):1);   // 丧尸更快 + 职业加成
  b.vx+=(ax*spd-b.vx)*0.06; b.vy+=(ay*spd-b.vy)*0.06;
  if(G.magnetUntil>G.time && b.val<p.val && d<330){ b.vx+=dx/d*260*dt; b.vy+=dy/d*260*dt; }
  b.x+=b.vx*dt; b.y+=b.vy*dt; clampEntity(b,10); collideObstacles(b);
}

/* ==================== 吞噬 ==================== */
function popup(x,y,txt,col){ G.popups.push({x,y,txt,col,t:0}); if(G.popups.length>30)G.popups.shift(); }
function flashMsg(txt){ toast(txt); }
let toastEl=null;
function toast(txt){ if(!toastEl){ toastEl=document.createElement("div"); toastEl.style.cssText="position:fixed;top:120px;left:50%;transform:translateX(-50%);background:rgba(12,16,34,.9);border:1px solid #26305a;color:#eef4ff;padding:8px 15px;border-radius:11px;font-weight:800;font-size:14px;z-index:18;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:86%;"; document.body.appendChild(toastEl); }
  toastEl.textContent=txt; toastEl.style.opacity="1"; clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.style.opacity="0",1200); }
function eatBot(b){ const p=G.player; const dbl=G.crownUntil>G.time?2:1;
  if(b.kind==="bomb"){ p.val=Math.max(1, Math.floor(p.val*0.9)-1); G.combo=0; p.r=radiusOf(p.val); popup(b.x,b.y,"💥","#ff5b6e"); toast(tr("💥 炸弹！掉了一截")); return; }
  let g=Math.max(1, Math.ceil(b.val*(EAT_PCT[G.mode]||0.75)));   // 吸收对方数值的 75%（能量 90%）
  if(b.kind==="gold"){ g+=2; popup(b.x,b.y,"+"+ (g), "#ffcf3a"); }
  else if(b.kind==="rainbow"){ g+=5; popup(b.x,b.y,"🌈+"+g,"#c46bff"); }
  else if(b.kind==="lucky7"){ if(Math.random()<0.45){ g+=3+Math.floor(Math.random()*8); } else { const c=50+Math.floor(Math.random()*220); G.coins+=c*dbl; popup(b.x,b.y,"🍀🪙+"+(c*dbl),"#31e07a"); } }
  else if(b.kind==="crown"){ G.crownUntil=G.time+8; toast(tr("👑 双倍金币")); }
  else if(b.kind==="freeze"){ G.frozenUntil=G.time+3; toast(tr("❄️ 冰冻！")); }
  if(b.boss){ g+=Math.max(2,Math.round(b.val*0.25)); const c=Math.round(b.val*0.8)*dbl; G.coins+=c; G.bossKills++; popup(b.x,b.y,"💀+"+fmt(g),"#ffcf3a"); toast(tr("💀 击败Boss！")+" 🎁 +"+fmt(c)); }
  G.combo++; G.comboT=G.time+1.6; if(G.combo>G.comboMax) G.comboMax=G.combo;
  if(G.combo>=3){ g+=Math.floor(G.combo/3); showCombo(); }
  p.val+=g; G.eats++; G.coins+=(b.boss?0:1)*dbl; p.r=radiusOf(p.val);
  if(p.val>G.best) G.best=p.val;
  if(!b.boss && b.kind==="normal") popup(b.x,b.y,"+"+fmt(g),"#31e07a");
  checkLevel();
}
function checkLevel(){ const lv=levelOf(G.player.val); if(lv>G.level){ G.level=lv; G.player.speedMul=1+(lv-1)*0.03; toast("⭐ "+tr("⭐ 升级！")+" Lv"+lv+" "+tr(lvName(lv))); for(let i=0;i<3;i++) flashRing(); } }
function flashRing(){ G.flashes.push({t:0}); if(G.flashes.length>6)G.flashes.shift(); }
function showCombo(){ const el=document.getElementById("combo"); el.textContent=G.combo+" "+tr("连击"); el.classList.add("show"); el.style.transform="translateX(-50%) scale(1.15)"; clearTimeout(el._t); el._t=setTimeout(()=>{el.classList.remove("show"); el.style.transform="translateX(-50%) scale(1)";},700); }
function tryShield(){ if(G.shieldUntil>G.time){ G.shieldUntil=0; G.invUntil=G.time+1.4; toast(tr("🛡️ 护盾挡下一击！")); return true; } return false; }

/* ==================== 技能 ==================== */
function useSkill(k){ if(!G||G.over||G.paused) return; if(G.time<G.cool[k]){ return; }
  if(k==="dash"){ G.dashUntil=G.time+0.45; toast(tr("⚡ 冲刺！")); }
  else if(k==="magnet"){ G.magnetUntil=G.time+4; toast(tr("🧲 磁铁！")); }
  else if(k==="shield"){ G.shieldUntil=G.time+6; toast(tr("🛡️ 护盾就绪")); }
  G.cool[k]=G.time+SKILLS[k].cd; }

/* ==================== 更新 ==================== */
function update(dt){ if(!G||G.over||G.paused) return; G.time+=dt; G._dt=dt;
  const p=G.player, virus=G.mode==="virus";
  roomTick(); if(G.over) return;   // 隐藏房间开/关（超时死亡）
  // 输入方向
  let mx=0,my=0;
  if(G.keyx||G.keyy){ mx=G.keyx; my=G.keyy; const m=hyp(mx,my)||1; mx/=m; my/=m; }
  else if(G.moving){ const dx=G.aimX-p.x, dy=G.aimY-p.y, d=hyp(dx,dy); if(d>5){ mx=dx/d; my=dy/d; } }
  let maxs=205*(1-Math.min(0.42,Math.log10(p.val+1)*0.045))*(G.dashUntil>G.time?2.15:1)*p.speedMul*(G.sprint?SPRINT_MUL:1)*((p.boostUntil||0)>G.time?SPEED_BOOST:1)*(G.zombie?ZOMBIE_SPEED*(G.zspd||1):1);
  p.vx+=(mx*maxs-p.vx)*0.16; p.vy+=(my*maxs-p.vy)*0.16;
  p.x+=p.vx*dt; p.y+=p.vy*dt; clampEntity(p,10); collideObstacles(p);
  if(G.architect && G.brickMax) G.bricks=Math.min(G.brickMax,(G.bricks||0)+dt*0.28);   // 砖块回充
  // 加速/爆炸方块随机刷新（病毒模式免除）
  if(!virus){
    if(Math.random()<0.006 && G.blocks.filter(b=>b.type==="speed").length<5) G.blocks.push({type:"speed",x:40+Math.random()*(WORLD_W-80),y:40+Math.random()*(WORLD_H-80),r:20});
    if(Math.random()<0.004 && G.blocks.filter(b=>b.type==="bomb").length<4) G.blocks.push({type:"bomb", x:40+Math.random()*(WORLD_W-80),y:40+Math.random()*(WORLD_H-80),r:20});
    for(let i=G.blocks.length-1;i>=0;i--){ const blk=G.blocks[i]; let hit=false;
      if(hyp(blk.x-p.x,blk.y-p.y) < p.r+blk.r){ hitBlock(blk,p); hit=true; }
      else { for(const b of G.bots){ if(hyp(blk.x-b.x,blk.y-b.y) < b.r+blk.r){ hitBlock(blk,b); hit=true; break; } } }
      if(hit) G.blocks.splice(i,1); }
  }
  // 食物刷新：外面很少，房间里多 500%（6倍）；吃到即按倍率暴涨
  if(Math.random()<0.02 && G.foods.filter(f=>!f.room).length<6) addFood(40+Math.random()*(WORLD_W-80),40+Math.random()*(WORLD_H-80),false);
  if(G.room&&G.room.active && Math.random()<0.12 && G.foods.filter(f=>f.room).length<42){ const R=G.room; addFood(R.x0+24+Math.random()*(R.x1-R.x0-48),R.y0+24+Math.random()*(R.y1-R.y0-48),true); }
  for(let i=G.foods.length-1;i>=0;i--){ const f=G.foods[i]; if(hyp(f.x-p.x,f.y-p.y) < p.r+f.r){ p.val=Math.ceil(p.val*f.mult); p.r=radiusOf(p.val); G.foods.splice(i,1); popup(f.x,f.y,f.label,f.col); if(p.val>G.best)G.best=p.val; checkLevel(); } }
  if(!virus && p.r>=BASU_RADIUS){ return gameOver("basu"); }   // 🏆 霸屏胜利：长到填满全屏
  // 毒圈
  if(G.zone){ if(G.time>=G.zone.next){ G.zone.next=G.time+7; G.zone.r=Math.max(210, G.zone.r*0.82); }
    const zd=hyp(p.x-G.zone.x,p.y-G.zone.y);
    if(zd>G.zone.r){ p._outAcc=(p._outAcc||0)+dt; if(p._outAcc>=0.5){ p._outAcc=0; p.val=Math.max(1,Math.floor(p.val*0.97)-1); p.r=radiusOf(p.val); popup(p.x,p.y-p.r-8,"☠-","#ff5b6e"); if(p.val<=1 && G.time>4){ return gameOver(); } } } else p._outAcc=0; }
  if(G.hurtFlash>0) G.hurtFlash-=dt;
  if(virus && (G._zNext==null || G.time>=G._zNext)){ assignZombieTargets(); G._zNext=G.time+0.3; }   // 每0.3秒重新分配目标（锁定感）
  // bots
  for(const b of G.bots) updateBot(b,dt);
  // 所有数字都能吃食物（食物不动、不吃数字）
  if(G.foods.length) for(const b of G.bots){ for(let i=G.foods.length-1;i>=0;i--){ const f=G.foods[i]; if(hyp(f.x-b.x,f.y-b.y) < b.r+f.r){ b.val=Math.ceil(b.val*f.mult); b.r=radiusOf(b.val,b.boss); G.foods.splice(i,1); } } }
  if(virus){ virusStep(dt); if(G.over) return; if(G.combo>0 && G.time>G.comboT) G.combo=0; ensureBots(); return; }
  // 引力：玩家 ↔ 数字（大小差越大吸力越强，相近则抵消）
  for(const b of G.bots){ const dx=b.x-p.x, dy=b.y-p.y, d=hyp(dx,dy); if(d>=GRAV.range||d<1) continue;
    const fall=1-d/GRAV.range, ratio=(b.val-p.val)/(b.val+p.val);
    if(ratio>0){ p.vx+=(dx/d)*GRAV.pull*ratio*fall*dt; p.vy+=(dy/d)*GRAV.pull*ratio*fall*dt; }
    else if(ratio<0){ const m=-ratio; b.vx+=(-dx/d)*GRAV.suck*m*fall*dt; b.vy+=(-dy/d)*GRAV.suck*m*fall*dt; }
  }
  // 数字 ↔ 数字：也互相吸引与吸收
  const N=G.bots.length;
  for(let i=0;i<N;i++){ const a=G.bots[i]; if(a.dead) continue;
    for(let j=i+1;j<N;j++){ const b=G.bots[j]; if(b.dead) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=hyp(dx,dy); if(d>=GRAV.range) continue;
      if(d>=1 && a.val!==b.val){ const fall=1-d/GRAV.range, big=a.val>b.val?a:b, sm=a.val>b.val?b:a;
        const m=(big.val-sm.val)/(big.val+sm.val), ux=(big.x-sm.x)/d, uy=(big.y-sm.y)/d;
        sm.vx+=ux*GRAV.suck*m*fall*dt*0.45; sm.vy+=uy*GRAV.suck*m*fall*dt*0.45; }
      if(d < a.r + b.r*0.85){                                  // 固体：几乎贴上才吃，减少穿模
        if(a.val>b.val*1.08){ a.val+=Math.max(1,Math.ceil(b.val*0.5)); a.r=radiusOf(a.val,a.boss); b.dead=true; }
        else if(b.val>a.val*1.08){ b.val+=Math.max(1,Math.ceil(a.val*0.5)); b.r=radiusOf(b.val,b.boss); a.dead=true; break; }
        else if(d>=1){ const ov=(a.r+b.r-d), ux=(a.x-b.x)/d, uy=(a.y-b.y)/d;   // 大小相近 → 互相弹开，不挤在一起
          a.vx+=ux*ov*5*dt; a.vy+=uy*ov*5*dt; b.vx-=ux*ov*5*dt; b.vy-=uy*ov*5*dt; }
      }
    }
  }
  if(G.bots.some(x=>x.dead)) G.bots=G.bots.filter(x=>!x.dead);
  // 玩家碰撞：吃小的；碰到大的不立即死，每0.7秒-30%
  let bigContact=false;
  for(let i=G.bots.length-1;i>=0;i--){ const b=G.bots[i]; const d=hyp(b.x-p.x,b.y-p.y);
    if(d < p.r + b.r*0.85){                                    // 固体：贴上才吃，减少穿模
      if(b.val < p.val){ eatBot(b); G.bots.splice(i,1); }
      else if(b.val > p.val){ bigContact=true; }
      else { const nx=(p.x-b.x)/(d||1), ny=(p.y-b.y)/(d||1); p.vx+=nx*30; p.vy+=ny*30; }
    }
  }
  if(bigContact && G.invUntil<=G.time){
    if(G.shieldUntil>G.time){ tryShield(); }
    else if(G.time>=G.hurtNext){ G.hurtNext=G.time+HURT_INTERVAL; p.val=Math.max(1,Math.floor(p.val*(1-HURT_LOSS))); p.r=radiusOf(p.val); G.combo=0; G.hurtFlash=0.5;
      popup(p.x,p.y-p.r-8,"-30%","#ff5b6e"); if(p.val<=1){ return gameOver(); } }
  }
  if(G.combo>0 && G.time>G.comboT) G.combo=0;
  ensureBots();
}

function gameOver(cause){ if(G.over) return; G.over=true; G.running=false; G.deathCause=cause;
  const v=G.player.val; const nb=v>loadBest(); saveBest(v); saveBoard(v,G.mode); saveCoins(loadCoins()+G.coins);
  document.getElementById("finalNum").textContent=fmt(v);
  document.getElementById("finalLv").textContent=G.level;
  document.getElementById("finalEats").textContent=G.eats;
  document.getElementById("finalCombo").textContent=G.comboMax;
  document.getElementById("finalCoins").textContent=fmt(G.coins);
  document.getElementById("newBest").style.display=nb?"block":"none";
  const surv=G.mode==="survive" && G.player.val<=1;
  document.getElementById("overTitle").textContent =
      cause==="basu"?tr("🏆 霸屏！你统治了全屏") : cause==="domination"?tr("全城沦陷！你赢了") : cause==="killed"?tr("你被消灭了") : cause==="zombie"?tr("你变成了丧尸！")
    : cause==="room"?tr("被困在隐藏房间！") : surv?(LANG==="en"?"WIPED OUT":"被毒圈吞没") : tr("被吞噬了！");
  if(cause==="basu") document.getElementById("overEn").textContent="SCREEN DOMINATED";
  if(G.mode==="virus") document.getElementById("overEn").textContent=tr("存活")+" "+Math.floor(G.survTime||0)+"s";
  document.getElementById("overOv").classList.remove("hidden");
}

/* ==================== 渲染 ==================== */
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); VW=window.innerWidth; VH=window.innerHeight;
  cv.width=VW*DPR; cv.height=VH*DPR; cv.style.width=VW+"px"; cv.style.height=VH+"px"; ctx.setTransform(DPR,0,0,DPR,0,0); }
function colorFor(b){ const p=G.player;
  if(b.zombie) return "#4caf50";   // 丧尸绿
  if(b.inf) return "#c9a83a";   // 被感染中（渐进变丧尸）：病黄色
  if(b.kind==="gold") return "#ffcf3a"; if(b.kind==="rainbow") return "#c46bff"; if(b.kind==="lucky7") return "#31e07a";
  if(b.kind==="bomb") return "#ff8f3a"; if(b.kind==="crown") return "#ffd76a"; if(b.kind==="freeze") return "#7fd0ff";
  if(b.boss) return "#ff5b6e"; if(b.val<p.val) return "#2f7d55"; if(b.val>p.val) return "#7a2f3c"; return "#4a4f70"; }
function render(){ if(!G) return; const p=G.player;
  const zoom=FIXED_ZOOM;   // 固定缩放：地图不随数字变大而变大
  const R=(G.room&&G.room.active)?G.room:null;
  let camx=p.x - VW/2/zoom, camy=p.y - VH/2/zoom;
  const camMaxX=(R?R.x1:WORLD_W)-VW/zoom;
  camx=clamp(camx,0,Math.max(0,camMaxX)); camy=clamp(camy,0,Math.max(0,WORLD_H-VH/zoom));
  if(WORLD_H<VH/zoom) camy=(WORLD_H-VH/zoom)/2;
  G.view={x0:camx-60,y0:camy-60,x1:camx+VW/zoom+60,y1:camy+VH/zoom+60};   // 供离屏消失判断
  ctx.setTransform(DPR*zoom,0,0,DPR*zoom,-camx*DPR*zoom,-camy*DPR*zoom);
  ctx.clearRect(camx-20,camy-20,VW/zoom+40,VH/zoom+40);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  // grid
  ctx.strokeStyle="rgba(60,74,130,.18)"; ctx.lineWidth=1; const gs=90;
  for(let x=Math.floor(camx/gs)*gs;x<camx+VW/zoom+gs;x+=gs){ ctx.beginPath();ctx.moveTo(x,camy-20);ctx.lineTo(x,camy+VH/zoom+20);ctx.stroke(); }
  for(let y=Math.floor(camy/gs)*gs;y<camy+VH/zoom+gs;y+=gs){ ctx.beginPath();ctx.moveTo(camx-20,y);ctx.lineTo(camx+VW/zoom+20,y);ctx.stroke(); }
  // border（发光边框；房间开启时右侧留开口）
  ctx.save(); ctx.shadowColor="rgba(120,180,255,.9)"; ctx.shadowBlur=20; ctx.strokeStyle="rgba(150,195,255,.95)"; ctx.lineWidth=10; ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(WORLD_W,0); ctx.lineTo(WORLD_W, R?R.y0:WORLD_H);
  if(R){ ctx.moveTo(WORLD_W,R.y1); ctx.lineTo(WORLD_W,WORLD_H); }
  ctx.lineTo(0,WORLD_H); ctx.lineTo(0,0); ctx.stroke(); ctx.restore();
  ctx.setLineDash([26,18]); ctx.strokeStyle="rgba(255,90,120,.5)"; ctx.lineWidth=3; ctx.strokeRect(6,6,WORLD_W-12,WORLD_H-12); ctx.setLineDash([]);
  // 隐藏房间（彩色）
  if(R){ const g2=ctx.createLinearGradient?ctx.createLinearGradient(R.x0,R.y0,R.x1,R.y1):null;
    if(g2&&g2.addColorStop){ g2.addColorStop(0,"rgba(255,92,138,.16)"); g2.addColorStop(0.5,"rgba(79,227,209,.15)"); g2.addColorStop(1,"rgba(196,107,255,.18)"); ctx.fillStyle=g2; } else ctx.fillStyle="rgba(120,80,180,.16)";
    ctx.fillRect(R.x0,R.y0,R.x1-R.x0,R.y1-R.y0);
    ctx.save(); ctx.shadowColor="#ffcf3a"; ctx.shadowBlur=16; ctx.setLineDash([22,14]); ctx.lineWidth=6; ctx.strokeStyle="#ffcf3a"; ctx.strokeRect(R.x0,R.y0,R.x1-R.x0,R.y1-R.y0); ctx.setLineDash([]); ctx.restore();
    ctx.strokeStyle="#7fffd6"; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(R.x0,R.y0+8); ctx.lineTo(R.x0,R.y1-8); ctx.stroke();
  }
  // 🏗️ 障碍墙
  for(const o of G.obstacles){ if(o.cx+o.hw<camx||o.cx-o.hw>camx+VW/zoom||o.cy+o.hh<camy||o.cy-o.hh>camy+VH/zoom) continue;
    ctx.fillStyle="rgba(118,128,158,.92)"; ctx.fillRect(o.cx-o.hw,o.cy-o.hh,o.hw*2,o.hh*2);
    ctx.strokeStyle="rgba(205,214,240,.95)"; ctx.lineWidth=3; ctx.strokeRect(o.cx-o.hw,o.cy-o.hh,o.hw*2,o.hh*2);
    ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=1; for(let yy=o.cy-o.hh+11;yy<o.cy+o.hh;yy+=12){ ctx.beginPath(); ctx.moveTo(o.cx-o.hw,yy); ctx.lineTo(o.cx+o.hw,yy); ctx.stroke(); } }
  // 🦠 病毒模式：尾迹 / 隔离带 / 解药
  if(G.mode==="virus"){
    for(const t of G.trails){ if(t.x<camx-40||t.x>camx+VW/zoom+40||t.y<camy-40||t.y>camy+VH/zoom+40) continue;
      ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fillStyle="rgba(76,175,80,"+Math.max(0,0.42*(1-t.t/TRAIL_LIFE))+")"; ctx.fill(); }
    if(G.quarantine){ const Q=G.quarantine; ctx.beginPath(); ctx.arc(Q.x,Q.y,Q.r,0,7); ctx.fillStyle="rgba(80,160,255,.12)"; ctx.fill();
      ctx.setLineDash([18,12]); ctx.strokeStyle="rgba(120,200,255,.9)"; ctx.lineWidth=4; ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="rgba(170,215,255,.95)"; ctx.font="900 15px ui-monospace,monospace"; ctx.fillText("🛡️ "+tr("隔离带"),Q.x,Q.y-Q.r-14); }
    for(const c of G.cures){ if(c.x<camx-40||c.x>camx+VW/zoom+40||c.y<camy-40||c.y>camy+VH/zoom+40) continue;
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,7); ctx.fillStyle="#31e07a"; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.stroke(); ctx.font="16px sans-serif"; ctx.fillText("💊",c.x,c.y); }
  }
  // 食物
  for(const f of G.foods){ if(f.x<camx-40||f.x>camx+VW/zoom+40||f.y<camy-40||f.y>camy+VH/zoom+40) continue;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fillStyle=f.col; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.stroke();
    ctx.fillStyle="#0b0d16"; ctx.font="900 10px ui-monospace,monospace"; ctx.fillText(f.label,f.x,f.y); }
  // 方块（加速/爆炸）
  for(const blk of G.blocks){ if(blk.x<camx-40||blk.x>camx+VW/zoom+40||blk.y<camy-40||blk.y>camy+VH/zoom+40) continue;
    ctx.fillStyle=blk.type==="speed"?"rgba(255,207,58,.92)":"rgba(255,91,110,.92)"; ctx.fillRect(blk.x-blk.r,blk.y-blk.r,blk.r*2,blk.r*2);
    ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.strokeRect(blk.x-blk.r,blk.y-blk.r,blk.r*2,blk.r*2);
    ctx.font="18px sans-serif"; ctx.fillText(blk.type==="speed"?"⚡":"💣",blk.x,blk.y); }
  // zone
  if(G.zone){ ctx.save(); ctx.beginPath(); ctx.rect(camx-20,camy-20,VW/zoom+40,VH/zoom+40); ctx.arc(G.zone.x,G.zone.y,G.zone.r,0,7,true);
    ctx.fillStyle="rgba(255,60,90,.14)"; ctx.fill("evenodd"); ctx.restore();
    ctx.beginPath(); ctx.arc(G.zone.x,G.zone.y,G.zone.r,0,7); ctx.strokeStyle="rgba(120,200,255,.8)"; ctx.lineWidth=4; ctx.stroke(); }
  // bots
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const b of G.bots){ if(b.x<camx-80||b.x>camx+VW/zoom+80||b.y<camy-80||b.y>camy+VH/zoom+80) continue;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fillStyle=colorFor(b); ctx.fill();
    ctx.lineWidth=b.boss?4:2; ctx.strokeStyle=b.boss?"#ffcf3a":"rgba(255,255,255,.25)"; ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="900 "+Math.max(11,Math.min(b.r*0.9,30))+"px ui-monospace,monospace";
    ctx.fillText(fmt(b.val), b.x, b.y);
    if(b.zombie){ ctx.font="14px sans-serif"; ctx.fillText("🧟", b.x, b.y-b.r-10); }
    else if(b.fighter){ ctx.font="12px sans-serif"; ctx.fillText("🔫", b.x, b.y-b.r-9); }
    else if(b.kind!=="normal"&&!b.boss){ ctx.font="12px sans-serif"; ctx.fillText({gold:"⭐",rainbow:"🌈",lucky7:"🍀",bomb:"💣",crown:"👑",freeze:"❄️"}[b.kind]||"", b.x, b.y-b.r-8); }
  }
  // player
  const inv=G.invUntil>G.time, sh=G.shieldUntil>G.time, greenP=(G.mode==="virus"&&(G.infected||G.zombie));
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle=G.zombie?"#4caf50":(greenP?"#7bbf5a":(inv?"#8fb8ff":"#4a90ff")); ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle=sh?"#7fd0ff":"#bcd6ff"; ctx.stroke();
  if(sh){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r+7,0,7); ctx.strokeStyle="rgba(127,208,255,.7)"; ctx.lineWidth=3; ctx.stroke(); }
  if(G.magnetUntil>G.time){ ctx.beginPath(); ctx.arc(p.x,p.y,330,0,7); ctx.strokeStyle="rgba(196,107,255,.25)"; ctx.lineWidth=2; ctx.stroke(); }
  ctx.fillStyle="#fff"; ctx.font="900 "+Math.max(13,Math.min(p.r*0.85,34))+"px ui-monospace,monospace"; ctx.fillText(fmt(p.val),p.x,p.y);
  // level flash rings
  for(const f of G.flashes){ if(f.boom){ ctx.beginPath(); ctx.arc(f.x,f.y,20+f.t*BOMB_R,0,7); ctx.fillStyle="rgba(255,91,110,"+Math.max(0,0.28-f.t*0.28)+")"; ctx.fill(); ctx.strokeStyle="rgba(255,120,140,"+(0.8-f.t*0.8)+")"; ctx.lineWidth=6; ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r+f.t*160,0,7); ctx.strokeStyle="rgba(255,207,58,"+(0.6-f.t*0.6)+")"; ctx.lineWidth=4; ctx.stroke(); } }
  // popups
  for(const q of G.popups){ ctx.globalAlpha=Math.max(0,1-q.t/0.9); ctx.fillStyle=q.col; ctx.font="900 15px ui-monospace,monospace"; ctx.fillText(q.txt,q.x,q.y-q.t*40); ctx.globalAlpha=1; }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // out-of-zone red vignette
  if(G.zone && hyp(p.x-G.zone.x,p.y-G.zone.y)>G.zone.r){ ctx.fillStyle="rgba(255,40,70,.16)"; ctx.fillRect(0,0,VW,VH); }
  if(G.hurtFlash>0){ ctx.fillStyle="rgba(255,40,70,"+Math.min(0.4,G.hurtFlash*0.7)+")"; ctx.fillRect(0,0,VW,VH); }
  // 隐藏房间：箭头引导 + 倒计时
  if(R){ const inside=isInRoom(p), left=Math.ceil(R.closeAt-G.time);
    if(!inside){ const ang=Math.atan2(R.cy-p.y,R.cx-p.x), rad=Math.min(VW,VH)*0.3;
      ctx.save(); ctx.translate(VW/2+Math.cos(ang)*rad, VH/2+Math.sin(ang)*rad); ctx.rotate(ang);
      ctx.fillStyle="#ffcf3a"; ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-12,-12); ctx.lineTo(-12,12); ctx.closePath(); ctx.fill(); ctx.restore(); }
    ctx.fillStyle=(inside&&left<=ROOM_WARN)?"#ff5b6e":"#ffcf3a"; ctx.font="900 14px ui-monospace,monospace"; ctx.textAlign="center";
    ctx.fillText("🚪 "+tr("隐藏房间")+" "+left+"s"+((inside&&left<=ROOM_WARN)?" · "+tr("快离开！"):""), VW/2, 40); }
  // 小地图
  { const mw=112, mh=Math.max(46,Math.round(mw*WORLD_H/WORLD_W)), mx=10, my=VH-mh-14, sx=mw/WORLD_W, sy=mh/WORLD_H;
    ctx.fillStyle="rgba(10,14,30,.72)"; ctx.fillRect(mx,my,mw,mh); ctx.strokeStyle="rgba(150,195,255,.7)"; ctx.lineWidth=1.5; ctx.strokeRect(mx,my,mw,mh);
    if(G.mode==="virus"){ ctx.fillStyle="rgba(76,175,80,.95)"; for(const b of G.bots){ if(b.zombie) ctx.fillRect(mx+Math.min(b.x,WORLD_W)*sx-1,my+b.y*sy-1,3,3); }
      if(G.quarantine){ ctx.strokeStyle="rgba(120,200,255,.9)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(mx+G.quarantine.x*sx,my+G.quarantine.y*sy,Math.max(2,G.quarantine.r*sx),0,7); ctx.stroke(); } }
    else { ctx.fillStyle="rgba(255,91,110,.85)"; for(const b of G.bots){ if(b.val>p.val && b.x<=WORLD_W){ ctx.fillRect(mx+b.x*sx-1,my+b.y*sy-1,2,2); } } }
    if(R){ ctx.fillStyle="rgba(255,207,58,.95)"; ctx.fillRect(mx+mw-3,my+R.cy*sy-6,5,12); }
    ctx.fillStyle="#7fd0ff"; ctx.beginPath(); ctx.arc(mx+Math.min(p.x,WORLD_W)*sx,my+p.y*sy,3,0,7); ctx.fill();
    ctx.fillStyle="rgba(180,200,255,.6)"; ctx.font="700 8px ui-monospace,monospace"; ctx.textAlign="left"; ctx.fillText(tr("小地图"),mx+3,my+9); }
}

/* ==================== HUD ==================== */
function hud(){ if(!G) return; document.getElementById("bignum").textContent=fmt(G.player.val);
  document.getElementById("lvPill").textContent="Lv"+G.level;
  document.getElementById("lvName").textContent=tr(lvName(G.level));
  document.getElementById("coins").textContent=fmt(G.coins);
  document.getElementById("best").textContent=fmt(G.best);
  for(const k of ["dash","magnet","shield"]){ const rem=Math.max(0,G.cool[k]-G.time), frac=rem/SKILLS[k].cd;
    const id={dash:"Dash",magnet:"Mag",shield:"Shield"}[k]; const el=document.getElementById("cool"+id); if(el) el.style.height=(frac*100)+"%";
    const btn=document.getElementById("sk"+id); if(btn){ btn.classList.toggle("ready",rem<=0);
      const act=(k==="dash"&&G.dashUntil>G.time)||(k==="magnet"&&G.magnetUntil>G.time)||(k==="shield"&&G.shieldUntil>G.time); btn.classList.toggle("active",act); } }
  const zi=document.getElementById("zoneInfo"); if(G.zone){ zi.style.display="block"; document.getElementById("zoneR").textContent=Math.round(G.zone.r); } else zi.style.display="none";
  const hw=document.getElementById("hpWrap");
  if(G.mode==="virus"){ hw.style.display="block"; const isZ=G.zombie, mx=isZ?G.zMax:G.maxHp, frac=Math.max(0,G.hp/mx);
    document.getElementById("hpFill").style.width=(frac*100)+"%";
    document.getElementById("hpFill").style.background=isZ?"linear-gradient(90deg,#2e7d32,#66bb6a)":(G.infected?"linear-gradient(90deg,#4caf50,#8bc34a)":"linear-gradient(90deg,#ff5b6e,#ff9f3a)");
    const cls=isZ?ZCLASSES.find(c=>c.id===G.zcls):CLASSES.find(c=>c.id===G.humanClass);
    document.getElementById("hpTxt").textContent=(isZ?"🧟 ":"❤️ ")+Math.ceil(G.hp)+"/"+Math.round(mx)+(isZ?" · "+tr("丧尸"):(G.infected?" · 🦠"+tr("感染中"):""))+" · "+(cls?cls.ico+nm(cls):"")+" · "+tr("存活")+" "+Math.floor(G.survTime||0)+"s";
  } else hw.style.display="none";
  const bb=document.getElementById("buildBar");
  if(G.mode==="virus" && G.architect){ bb.style.display="flex"; document.getElementById("brickTxt").textContent="🧱 "+Math.floor(G.bricks)+"/"+G.brickMax; }
  else bb.style.display="none";
}

/* ==================== 循环 ==================== */
function loop(t){ raf=requestAnimationFrame(loop); if(!lastT) lastT=t; let dt=(t-lastT)/1000; lastT=t; if(dt>0.05) dt=0.05;
  for(const f of G.flashes) f.t+=dt; G.flashes=G.flashes.filter(f=>f.t<1);
  for(const q of G.popups) q.t+=dt; G.popups=G.popups.filter(q=>q.t<0.9);
  update(dt); render(); hud(); }

/* ==================== 控制 ==================== */
function toWorld(cx,cy){ const p=G.player; const zoom=FIXED_ZOOM; let camx=p.x-VW/2/zoom, camy=p.y-VH/2/zoom;
  camx=clamp(camx,0,WORLD_W-VW/zoom); camy=clamp(camy,0,WORLD_H-VH/zoom); return {x:camx+cx/zoom, y:camy+cy/zoom}; }
function pointerMove(cx,cy){ if(!G) return; const w=toWorld(cx,cy); G.aimX=w.x; G.aimY=w.y; }
function bindInput(){
  cv.addEventListener("mousemove",e=>{ pointerMove(e.clientX,e.clientY); G.moving=true; });
  cv.addEventListener("mousedown",e=>{ pointerMove(e.clientX,e.clientY); G.moving=true; });
  cv.addEventListener("touchstart",e=>{ e.preventDefault(); const t=e.touches[0]; pointerMove(t.clientX,t.clientY); G.moving=true;
    clearTimeout(G._spT); G._spT=setTimeout(()=>{ if(G&&G.moving) G.sprint=true; },260); },{passive:false});   // 长按加速
  cv.addEventListener("touchmove",e=>{ e.preventDefault(); const t=e.touches[0]; pointerMove(t.clientX,t.clientY); G.moving=true; },{passive:false});
  cv.addEventListener("touchend",e=>{ e.preventDefault(); if(!e.touches.length){ G.moving=false; G.sprint=false; clearTimeout(G._spT); } },{passive:false});
  window.addEventListener("keydown",e=>{ if(!G) return; const k=e.key.toLowerCase();
    if(k==="a"||k==="arrowleft") G.keyx=-1; else if(k==="d"||k==="arrowright") G.keyx=1;
    else if(k==="w"||k==="arrowup") G.keyy=-1; else if(k==="s"||k==="arrowdown") G.keyy=1;
    else if(k==="1") useSkill("dash"); else if(k==="2") useSkill("magnet"); else if(k==="3") useSkill("shield");
    else if(k==="q") placeObstacle("square"); else if(k==="e") placeObstacle("rect");
    else if(k===" "){ G.sprint=true; e.preventDefault(); } });     // 空格 = 加速（按住）
  window.addEventListener("keyup",e=>{ if(!G) return; const k=e.key.toLowerCase();
    if(k==="a"||k==="arrowleft"||k==="d"||k==="arrowright") G.keyx=0;
    if(k==="w"||k==="arrowup"||k==="s"||k==="arrowdown") G.keyy=0;
    if(k===" ") G.sprint=false; });
}

/* ==================== 模式/界面 ==================== */
const MODES=[
  {id:"classic", ico:"🍽️", zh:"经典模式", en:"Classic", d:"吃比自己小的+1，靠连击与Boss暴涨", pri:true},
  {id:"energy",  ico:"⚡", zh:"能量模式", en:"Energy",  d:"吸收被吃数字的一半，成长飞快"},
  {id:"survive", ico:"☠️", zh:"生存模式", en:"Survival", d:"毒圈不断缩小，圈外掉数字，活到最后"},
  {id:"virus",   ico:"🦠", zh:"病毒模式", en:"Virus", d:"末日丧尸：躲避感染、抢解药、进隔离带，选职业求生"},
];
function buildModes(){ const box=document.getElementById("modeList"); if(!box) return; box.innerHTML="";
  MODES.forEach(m=>{ const el=document.createElement("div"); el.className="mode"+(m.pri?" pri":"");
    el.innerHTML=`<div class="mi">${m.ico}</div><div class="mt"><div class="mn">${LANG==="en"?m.en:m.zh}</div><div class="md">${tr(m.d)}</div></div>`;
    el.onclick=()=> m.id==="virus"?openClassPicker():startGame(m.id, mapSizeId); box.appendChild(el); }); }
function renderBoard(){ const box=document.getElementById("boardBox"); if(!box) return; const b=loadBoard();
  let h=`<div style="font-weight:900;margin-bottom:4px">🏆 ${tr("排行榜")}</div>`;
  if(!b.length) h+=`<div style="color:#4a5480">${tr("暂无记录")}</div>`;
  else b.forEach((r,i)=>{ h+=`<div class="br"><span>${["🥇","🥈","🥉","4","5"][i]} ${tr((MODES.find(m=>m.id===r.mode)||{zh:"经典模式",en:"Classic"})[LANG==="en"?"en":"zh"])}</span><b>${fmt(r.v)}</b></div>`; });
  box.innerHTML=h;
  document.getElementById("startBest").textContent=fmt(loadBest());
  document.getElementById("startCoins").textContent=fmt(loadCoins());
}
function startGame(mode, sizeId, classId, asZombie){ applyMapSize(sizeId||mapSizeId);
  document.getElementById("startOv").classList.add("hidden"); document.getElementById("overOv").classList.add("hidden");
  const co=document.getElementById("classOv"); if(co) co.classList.add("hidden");
  G=freshG(mode);
  if(mode==="virus"){ if(asZombie){ applyClass(G,"civilian"); seedVirusPeople(true); turnPlayerZombie(classId); } else { applyClass(G, classId||"civilian"); seedVirusPeople(); } }
  else ensureBots();
  lastT=0; if(!raf) raf=requestAnimationFrame(loop); hud();
  document.getElementById("pauseBtn").textContent="⏸️"; }
function mkClass(c, fn){ const el=document.createElement("div"); el.className="mode";
  el.innerHTML=`<div class="mi">${c.ico}</div><div class="mt"><div class="mn">${LANG==="en"?c.en:c.zh}</div><div class="md">${tr(c.d)}</div></div>`;
  el.onclick=fn; return el; }
function buildClasses(){ const box=document.getElementById("classList"); if(!box) return; box.innerHTML="";
  const h1=document.createElement("div"); h1.style.cssText="font-size:12px;font-weight:800;color:var(--muted);margin:2px 0 4px;text-align:left"; h1.textContent="🧑 "+tr("人类职业（求生）"); box.appendChild(h1);
  CLASSES.forEach(c=> box.appendChild(mkClass(c, ()=>startGame("virus", mapSizeId, c.id, false))));
  const h2=document.createElement("div"); h2.style.cssText="font-size:12px;font-weight:800;color:#7bbf5a;margin:10px 0 4px;text-align:left"; h2.textContent="🧟 "+tr("丧尸职业（感染全城）"); box.appendChild(h2);
  ZCLASSES.forEach(c=> box.appendChild(mkClass(c, ()=>startGame("virus", mapSizeId, c.id, true)))); }
function openClassPicker(){ document.getElementById("startOv").classList.add("hidden"); buildClasses(); document.getElementById("classOv").classList.remove("hidden"); }
function toggleFullscreen(){ try{ const d=document, el=d.documentElement;
  if(!d.fullscreenElement && !d.webkitFullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
  else { (d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d); } }catch(e){} }
function buildMapSel(){ const box=document.getElementById("mapSel"); if(!box) return; box.innerHTML="";
  MAP_SIZES.forEach(m=>{ const on=m.id===mapSizeId; const el=document.createElement("div");
    el.style.cssText="flex:1;max-width:92px;padding:8px 4px;border-radius:10px;border:1px solid "+(on?"var(--blue)":"var(--line)")+";cursor:pointer;font-weight:800;font-size:14px;text-align:center;background:"+(on?"#4a90ff":"rgba(18,24,52,.8)")+";color:"+(on?"#04122e":"var(--ink)");
    el.innerHTML=(LANG==="en"?m.en:m.zh)+"<br><small style='font-weight:600;opacity:.7;font-size:9px'>"+m.w+"×"+m.h+"</small>";
    el.onclick=()=>{ mapSizeId=m.id; try{localStorage.setItem("neMap",m.id);}catch(e){} buildMapSel(); }; box.appendChild(el); }); }
function backToStart(){ document.getElementById("overOv").classList.add("hidden"); renderBoard(); document.getElementById("startOv").classList.remove("hidden"); }
function togglePause(){ if(!G||G.over) return; G.paused=!G.paused; document.getElementById("pauseBtn").textContent=G.paused?"▶️":"⏸️"; if(G.paused) toast(tr("暂停中")); }
