<style>

  body{background:radial-gradient(1000px 600px at 50% -8%,#1c2246,#0b0d18 60%),var(--bg);color:var(--ink);

  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .cred{font-family:ui-monospace,monospace;font-weight:900;font-size:22px;color:var(--gold);display:flex;align-items:center;gap:5px;text-shadow:0 0 14px rgba(255,207,58,.35);}

  .lvbadge{display:flex;align-items:center;gap:6px;background:#0e1226;border:1px solid var(--line);border-radius:10px;padding:5px 9px;cursor:pointer;}
  .lvbadge .lvi{font-size:18px;} .lvbadge .lvt{font-size:12px;font-weight:800;} .lvbadge .lvn{font-size:9px;color:var(--muted);}
  .pbar{height:7px;background:#0c0f22;border-radius:5px;overflow:hidden;margin-top:7px;}
  .pbar>div{height:100%;background:linear-gradient(90deg,var(--gold),#ff9f43);transition:width .4s;}
  .pmeta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px;}

  .banner{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(135deg,#2a1c4a,#141733 60%,#0e1a2e);min-height:150px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:16px 12px;text-align:center;margin-bottom:9px;}
  .banner::before{content:"";position:absolute;inset:0;background:
    radial-gradient(200px 120px at 20% 15%,rgba(255,92,138,.28),transparent),
    radial-gradient(220px 130px at 85% 85%,rgba(79,227,209,.22),transparent),
    repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 8px,transparent 8px 18px);pointer-events:none;}
  .banner h1{margin:0;font-size:23px;font-weight:900;letter-spacing:1px;position:relative;background:linear-gradient(90deg,#ffe08a,#ff7ac2,#4fe3d1);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .banner .bsub{position:relative;color:#c9d0ff;font-size:12px;margin-top:5px;opacity:.9;}
  .banner .bemo{position:relative;font-size:26px;letter-spacing:4px;margin-top:9px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .draw{border:none;border-radius:14px;padding:14px 8px;font-weight:900;font-size:16px;cursor:pointer;color:#1a1020;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#ffe08a,#ffb53a);box-shadow:0 5px 0 #b47d17,0 8px 18px rgba(255,181,58,.3);}
  .draw.ten{background:linear-gradient(180deg,#ff9ecb,#ff5c8a);box-shadow:0 5px 0 #b02f5a,0 8px 18px rgba(255,92,138,.3);color:#fff;}
  .draw:active{transform:translateY(3px);box-shadow:0 2px 0 #b47d17;}
  .draw .dc{display:block;font-size:11px;font-weight:800;opacity:.85;margin-top:2px;}
  .draw:disabled{filter:grayscale(.6) brightness(.7);box-shadow:none;cursor:not-allowed;}
  .subbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;}
  .sbtn{border:1px solid var(--line);background:#141833;color:var(--ink);border-radius:12px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;position:relative;}
  .sbtn:active{transform:scale(.97);} .sbtn.hot{border-color:var(--green);color:#bfffd6;}
  .sbtn small{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:1px;}
  .cd{color:var(--muted);}

  .dock{display:flex;gap:5px;margin-top:auto;padding-top:8px;}
  .ib{flex:1;background:#141833;border:1px solid var(--line);border-radius:11px;padding:8px 2px;cursor:pointer;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}
  .ib:active{transform:scale(.94);} .ib i{font-size:18px;font-style:normal;} .ib b{font-size:9px;font-weight:800;}
  .ib .bdg{position:absolute;top:-5px;right:-3px;min-width:15px;height:15px;line-height:15px;background:var(--red);color:#fff;
    border-radius:8px;font-size:9px;font-weight:900;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #0b0d18;}
  .ib .bdg.pulse{animation:pulse 1s infinite;} @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  /* overlay */
  .ov{position:fixed;inset:0;background:rgba(6,8,18,.82);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0;}

  .sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#151934,#0e1124);
    border:1px solid var(--line);border-radius:18px 18px 0 0;padding:15px 14px calc(15px + env(safe-area-inset-bottom));}
  .sheet h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px;}
  .x{margin-left:auto;background:#222a4a;border:none;color:var(--ink);border-radius:9px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:13px;}

  /* rarity themes */
  .r-N{--rc:#c7ccd6;} .r-R{--rc:#4a90ff;} .r-SR{--rc:#a45cff;} .r-SSR{--rc:#ffcf3a;}
  .r-UR{--rc:#ff7ac2;} .r-MR{--rc:#ff4d4d;} .r-GR{--rc:#ffd700;} .r-OR{--rc:#7fefff;}
  .rtag{display:inline-block;font-weight:900;font-size:10px;padding:1px 6px;border-radius:6px;color:#0b0d18;background:var(--rc);}

  /* result cards */
  .rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .rgrid.one{grid-template-columns:1fr;max-width:220px;margin:0 auto;}
  .card{position:relative;border-radius:11px;padding:8px 4px 6px;text-align:center;background:linear-gradient(180deg,#1c2140,#12152a);
    border:2px solid var(--rc);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 14px -2px var(--rc);overflow:hidden;animation:pop .35s backwards;}
  .rgrid.one .card{padding:20px 10px 14px;}
  @keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .card .cico{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
  .rgrid.one .card .cico{font-size:58px;}
  .card .cno{font-size:8px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:3px;}
  .card .cnm{font-size:9px;font-weight:800;margin-top:1px;line-height:1.15;min-height:22px;display:flex;align-items:center;justify-content:center;}
  .rgrid.one .card .cnm{font-size:15px;min-height:0;margin-top:6px;}
  .card .crt{margin-top:3px;}
  .card .cnew{position:absolute;top:2px;left:2px;background:var(--red);color:#fff;font-size:8px;font-weight:900;padding:1px 4px;border-radius:5px;transform:rotate(-8deg);}
  .card .cdup{position:absolute;top:2px;right:2px;background:#0c0f22;color:var(--gold);font-size:8px;font-weight:900;padding:1px 4px;border-radius:5px;}
  .card .cvar{position:absolute;bottom:2px;right:3px;font-size:11px;}
  .card.foil{box-shadow:0 0 0 1px #fff6,0 0 16px -1px var(--rc);}
  .card.foil::after,.card.rainbow::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 62%);
    background-size:250% 250%;animation:shine 2.2s infinite;}
  .card.rainbow{border-image:linear-gradient(120deg,#ff5c8a,#ffcf3a,#4fe3d1,#a45cff,#ff5c8a) 1;}
  .card.rainbow::after{background:linear-gradient(120deg,rgba(255,92,138,.35),rgba(255,207,58,.35),rgba(79,227,209,.35),rgba(164,92,255,.35));background-size:300% 300%;animation:rbw 3s linear infinite;}
  @keyframes shine{0%{background-position:120% 0;}100%{background-position:-40% 0;}}
  @keyframes rbw{0%{background-position:0 0;}100%{background-position:300% 0;}}
  .card.big-hit{animation:pop .35s backwards, glowpulse 1.2s .35s infinite;}
  @keyframes glowpulse{0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 14px -2px var(--rc);}50%{box-shadow:0 0 0 2px var(--rc),0 0 26px 2px var(--rc);}}
  .rsum{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 4px;}

  /* 图鉴 */
  .tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;} .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;background:#141833;border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
  .tab.on{background:var(--gold);color:#1a1020;border-color:var(--gold);}
  .dexgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}

  .dex .dico{font-size:22px;} .dex.miss .dico{filter:grayscale(1) brightness(.4);opacity:.55;}

  .dex .dvar{position:absolute;top:1px;left:2px;font-size:10px;}

  .ladder .lrow.cur{border-color:var(--gold);background:#1c1a0e;}
  .ladder .lrow.done{opacity:.85;} .ladder .li{font-size:20px;} .ladder .lt{flex:1;} .ladder .ln{font-weight:800;font-size:13px;}
  .ladder .ld{font-size:10px;color:var(--muted);margin-top:1px;} .ladder .lv{font-size:11px;font-weight:800;color:var(--gold);}
  .mrow{display:flex;align-items:center;gap:10px;background:#12152a;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:6px;}
  .mrow .mi{font-size:26px;} .mrow .mt{flex:1;} .mrow .mn{font-weight:800;font-size:14px;} .mrow .md{font-size:11px;color:var(--muted);margin-top:1px;}
  .cbtn{border:none;border-radius:9px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;background:var(--green);color:#04140b;}
  .cbtn.dis{background:#2a3250;color:var(--muted);cursor:default;} .cbtn.locked{background:#2a3250;color:var(--muted);cursor:default;}

  .toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#161b36;border:1px solid var(--line);
    color:var(--ink);padding:9px 15px;border-radius:11px;font-size:13px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .disc{font-size:9px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.5;}
</style>

function tr(s){ return LANG==="en" ? (TR[s]||s) : s; }
function nm(o){ return o ? (LANG==="en" ? (o.en||o.zh) : o.zh) : ""; }
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = tr(el.getAttribute("data-i18n")); });
  byId("langLbl").textContent = LANG==="en" ? "中" : "EN";
  byId("credLbl").textContent = tr("点券");
  renderHud();
  ["result","dex","lv","med","help"].forEach(id=>{ const ov=byId(id+"Ov"); if(ov && !ov.classList.contains("hidden")){
    ({result:()=>{}, dex:renderDex, lv:renderLevels, med:renderMedals, help:renderHelp})[id]?.(); } });
}
function toggleLang(){ LANG = LANG==="en"?"zh":"en"; try{ localStorage.setItem("gachaLang",LANG); }catch(e){} applyLang(); }

const RARITIES=[

const FWEIGHT=FCARDS.reduce((s,f)=>s+f.w,0);
function rollFunction(){ let r=Math.random()*FWEIGHT; for(const f of FCARDS){ r-=f.w; if(r<0) return f; } return FCARDS[0]; }
const FUNC_CHANCE=0.15;   // 每抽 15% 概率是功能卡

/*==================== 状态 & 存档 ====================*/
let S=null;
const HARD_PITY=70;   // 连续 70 抽未出 SSR+ 则保底
function fresh(){ return {
  credits:800, lifeCredits:0, owned:{}, variant:{}, pity:0, drawn:0, medals:[],
  lastClaim:0, lastFree:0, dblNext:0, halfPrice:0, freeDraws:0, bestRar:"" }; }
function save(){ try{ localStorage.setItem("gachaSave", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem("gachaSave")); if(d&&d.owned){ S=Object.assign(fresh(), d); return true; } }catch(e){} return false; }

/*==================== 抽卡核心 ====================*/
function rollRarity(){ const r=Math.random(); let acc=0; for(const R of RARITIES){ acc+=R.p; if(r<acc) return R.id; } return "N"; }
function rollVariant(){ const r=Math.random(); if(r<0.005)return 3; if(r<0.03)return 2; if(r<0.12)return 1; return 0; }
function atLeast(minId, rid){ return RIDX[rid] < RIDX[minId] ? minId : rid; }

// 产出一张卡的结果对象（不写 UI）
function drawOne(opts){ opts=opts||{};
  // 功能卡
  if(!opts.noFunc && Math.random()<FUNC_CHANCE){ const f=rollFunction(); applyFunc(f); return {func:f}; }
  let rid=rollRarity();
  if(S.pity>=HARD_PITY) rid=atLeast("SSR", rid);
  if(opts.min) rid=atLeast(opts.min, rid);
  if(RIDX[rid]>=RIDX["SSR"]) S.pity=0; else S.pity++;
  const pool=POOL[rid]; const card=pool[Math.floor(Math.random()*pool.length)];
  const v=rollVariant();
  const isNew = !(S.owned[card.id]);
  S.owned[card.id]=(S.owned[card.id]||0)+1;
  S.drawn++;
  let dust=0;
  if(!isNew){ dust=Math.round(RAR[rid].dust*VARIANTS[v].mult*(S.dblNext>0?2:1)); addCredits(dust); if(S.dblNext>0)S.dblNext--; }
  if(v>(S.variant[card.id]||0)) S.variant[card.id]=v;
  if(!S.bestRar || RIDX[rid]>RIDX[S.bestRar]) S.bestRar=rid;
  return {card, rid, v, isNew, dust};
}
function applyFunc(f){
  if(f.k==="credit"){ addCredits(f.amt); }
  else if(f.k==="free"){ S.freeDraws+=f.amt; }
  else if(f.k==="double"){ S.dblNext+=1; }
  else if(f.k==="half"){ S.halfPrice+=f.amt; }
  else if(f.k==="bank"){ addCredits(300+pointLevel()*150); }
  else if(f.k==="lucky"){ S.dblNext+=1; S.freeDraws+=1; }
}
function addCredits(n){ S.credits+=n; S.lifeCredits+=Math.max(0,n); }
function drawCost(single){ const base=single?100:900; let c=Math.round(base*(1-drawDiscount())); if(S.halfPrice>0) c=Math.round(c/2); return c; }

function drawSingle(){ if(!S)return;
  const cost=drawCost(true); if(S.credits<cost){ toast(tr("点券不足")); return; }
  S.credits-=cost; if(S.halfPrice>0)S.halfPrice--;
  const before=pointLevel();
  const res=[drawOne()];
  afterDraw(res, before);
}
function drawTen(){ if(!S)return;
  const cost=drawCost(false); if(S.credits<cost){ toast(tr("点券不足")); return; }
  S.credits-=cost; if(S.halfPrice>0)S.halfPrice--;
  const before=pointLevel();
  const res=[]; for(let i=0;i<10;i++) res.push(drawOne());
  // 十连保底：无 SR+ 收藏卡则最后一张升到 SR
  const hasHi = res.some(r=>r.card && RIDX[r.rid]>=RIDX["SR"]);
  if(!hasHi){ res[9]=forceCard("SR"); }
  afterDraw(res, before);
}
function forceCard(minId){ const pool=POOL[minId]; const card=pool[Math.floor(Math.random()*pool.length)];
  const v=rollVariant(); const isNew=!(S.owned[card.id]); S.owned[card.id]=(S.owned[card.id]||0)+1; S.drawn++;
  let dust=0; if(!isNew){ dust=Math.round(RAR[minId].dust*VARIANTS[v].mult); addCredits(dust); }
  if(v>(S.variant[card.id]||0)) S.variant[card.id]=v; S.pity=0; return {card,rid:minId,v,isNew,dust}; }

function freeDraw(){ if(!S)return; if(S.freeDraws>0){ S.freeDraws--; const before=pointLevel(); afterDraw([drawOne({noFunc:true})], before); return; }
  const now=Date.now(); const CD=45000;
  if(now-(S.lastFree||0) < CD){ toast(tr("先玩一会再来")); return; }
  S.lastFree=now; const before=pointLevel(); afterDraw([drawOne({noFunc:true})], before); }

function claimFree(){ if(!S)return; const now=Date.now(); const CD=20000;
  if(now-(S.lastClaim||0) < CD){ toast(tr("先玩一会再来")); return; }
  S.lastClaim=now; const amt=claimAmount(); addCredits(amt); toast("🎁 +"+amt+" "+tr("点券")); afterState(); }

function afterDraw(res, beforeLv){
  showResult(res);
  const afterLv=pointLevel();
  if(afterLv>beforeLv) setTimeout(()=>levelUpToast(afterLv), 400);
  afterState();
}
function afterState(){ save(); renderHud(); refreshOpen(); }

function showResult(res){
  const single=res.length===1;
  let h=`<h2>🎴 <span>${tr("本次抽卡")}</span><button class="x" onclick="closeOv('resultOv')">${tr("关闭")}</button></h2>`;

  res.forEach((r,i)=>{ h+=cardHTML(r, single).replace('class="card', `style="animation-delay:${i*0.06}s" class="card`); });
  h+=`</div>`;
  // summary
  const dust=res.reduce((s,r)=>s+(r.dust||0),0), news=res.filter(r=>r.card&&r.isNew).length, funcs=res.filter(r=>r.func).length;
  h+=`<div class="rsum">${tr("新卡")}: ${news} · ${tr("重复")} +${dust} 💰${funcs?` · 🎁${funcs}`:""}</div>`;
  h+=`<div class="fgrid2"><button class="draw" onclick="closeOv('resultOv');drawSingle()">🎴 ${tr("单抽")} ${fmt(drawCost(true))}</button>
    <button class="draw ten" onclick="closeOv('resultOv');drawTen()">🎴×10 ${fmt(drawCost(false))}</button></div>`;
  if(S.pity>=HARD_PITY-15) h+=`<div class="note">🎯 ${tr("保底临近")}：${HARD_PITY-S.pity} ${tr("距保底")}</div>`;
  byId("resultSheet").innerHTML=h;
  byId("resultOv").classList.remove("hidden");
}

/* 图鉴 */
let dexFilter="all";
function openDex(){ if(!S)return; dexFilter="all"; byId("dexOv").classList.remove("hidden"); renderDex(); }
function setDexFilter(f){ dexFilter=f; renderDex(); }
function renderDex(){
  const u=uniqueOwned(), ci=collLevelIdx();
  const cl = ci>=0?CLV[ci]:null, cn=CLV[Math.min(ci+1,CLV.length-1)];
  let h=`<h2>📖 <span>${tr("图鉴")}</span><button class="x" onclick="closeOv('dexOv')">${tr("关闭")}</button></h2>`;
  h+=`<div class="lrow cur" style="display:flex;align-items:center;gap:9px;background:#12152a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px">
    <span style="font-size:22px">${cl?cl.ico:"📔"}</span>
    <div style="flex:1"><div style="font-weight:800;font-size:13px">${cl?nm(cl):tr("收藏等级")}</div>
      <div style="font-size:10px;color:var(--muted)">${tr("已拥有")} ${u}/${TOTAL_CARDS} ${tr("张")} · ${tr("收藏进度")} ${Math.round(u/TOTAL_CARDS*100)}%</div></div>
    <div style="font-size:11px;font-weight:800;color:var(--gold)">${ci<CLV.length-1?(u+"/"+cn.need):"👑 MAX"}</div></div>`;
  h+=`<div class="tabs"><div class="tab${dexFilter==='all'?' on':''}" onclick="setDexFilter('all')">${tr("全部")} ${u}/${TOTAL_CARDS}</div>`;
  RARITIES.forEach(r=>{ const own=POOL[r.id].filter(c=>S.owned[c.id]).length;
    h+=`<div class="tab${dexFilter===r.id?' on':''}" onclick="setDexFilter('${r.id}')" style="${dexFilter===r.id?'':'color:'+r.col}">${r.id} ${own}/${r.cnt}</div>`; });
  h+=`</div>`;
  const list = dexFilter==="all"?CARDS:POOL[dexFilter];
  h+=`<div class="dexgrid">`;
  list.forEach(c=>{ const cnt=S.owned[c.id]||0, have=cnt>0, v=S.variant[c.id]||0;
    h+=`<div class="dex r-${c.r} ${have?'have':'miss'} ${have&&v>=1?'foilv':''}">
      ${cnt>1?`<span class="dcnt">×${cnt}</span>`:""}${have&&v>0?`<span class="dvar">${VARIANTS[v].b}</span>`:""}
      <div class="dico">${have?c.ico:"❓"}</div>
      <div class="dno">${c.mem?"👑":""}No.${String(c.no).padStart(3,"0")}</div>
      <div class="dnm">${have?nm(c):"???"}</div></div>`; });
  h+=`</div>`;
  byId("dexSheet").innerHTML=h;
}

/* 等级 */
function openLevels(){ if(!S)return; byId("lvOv").classList.remove("hidden"); renderLevels(); }
function renderLevels(){
  const idx=pointLevel();
  let h=`<h2>💰 <span>${tr("点券等级")}</span><button class="x" onclick="closeOv('lvOv')">${tr("关闭")}</button></h2>`;
  h+=`<div class="note" style="text-align:left;margin:0 0 8px">${tr("累计消耗点券提升点券等级，解锁折扣等特权。")}<br>
    🏷️ ${tr("抽卡折扣")}: <b>${Math.round(drawDiscount()*100)}%</b> · 🎁 ${tr("每次领点券")}: <b>+${claimAmount()}</b></div>`;
  h+=`<div class="ladder">`;
  PLV.forEach((p,i)=>{ const cur=i===idx, done=i<idx; const perk=Math.min(25,i*2);
    h+=`<div class="lrow ${cur?'cur':''} ${done?'done':''}">
      <span class="li">${p.ico}</span>
      <div class="lt"><div class="ln">Lv${p.lv} ${nm(p)} ${cur?'◀':''}</div>
        <div class="ld">${tr("累计点券")} ${fmt(p.need)} · 🏷️ -${perk}%</div></div>
      <div class="lv">${done?'✔':cur?'●':fmt(p.need)}</div></div>`; });
  h+=`</div>`;
  // 收藏等级
  const u=uniqueOwned(), ci=collLevelIdx();
  h+=`<h2 style="margin-top:14px">🎖️ <span>${tr("收藏等级")}</span></h2><div class="ladder">`;
  CLV.forEach((c,i)=>{ const cur=i===ci, done=i<ci;
    h+=`<div class="lrow ${cur?'cur':''} ${done?'done':''}"><span class="li">${c.ico}</span>
      <div class="lt"><div class="ln">${nm(c)}</div><div class="ld">${tr("已拥有")} ${c.need} ${tr("张")}</div></div>
      <div class="lv">${u>=c.need?'✔':u+'/'+c.need}</div></div>`; });
  h+=`</div>`;
  byId("lvSheet").innerHTML=h;
}

/* 勋章 */
function openMedals(){ if(!S)return; byId("medOv").classList.remove("hidden"); renderMedals(); }
function claimMedal(i){ const m=MEDALS[i]; if(pointLevel()+1<m.lv){ toast(tr("未达成")); return; } if(S.medals.includes(m.lv)){ return; }
  S.medals.push(m.lv); addCredits(m.reward); toast(m.ico+" "+nm(m)+" +"+m.reward); afterState(); }
function renderMedals(){
  let h=`<h2>🏅 <span>${tr("勋章任务")}</span><button class="x" onclick="closeOv('medOv')">${tr("关闭")}</button></h2>`;
  h+=`<div class="note" style="text-align:left;margin:0 0 8px">${tr("达到点券等级里程碑可领取勋章奖励。")}</div>`;
  MEDALS.forEach((m,i)=>{ const reached=pointLevel()+1>=m.lv, claimed=S.medals.includes(m.lv);
    h+=`<div class="mrow"><span class="mi" style="${reached?'':'filter:grayscale(1) opacity(.5)'}">${m.ico}</span>
      <div class="mt"><div class="mn">${nm(m)}</div><div class="md">${tr("达到等级")} ${m.lv} · +${fmt(m.reward)} 💰</div></div>
      ${claimed?`<button class="cbtn dis">${tr("已领取")}</button>`
        :reached?`<button class="cbtn" onclick="claimMedal(${i})">${tr("领取")}</button>`
        :`<button class="cbtn locked">${tr("未达成")}</button>`}</div>`; });
  byId("medSheet").innerHTML=h;
}

/* 玩法 */
function openHelp(){ byId("helpOv").classList.remove("hidden"); renderHelp(); }
function renderHelp(){
  let h=`<h2>❓ <span>${tr("玩法说明")}</span><button class="x" onclick="closeOv('helpOv')">${tr("关闭")}</button></h2>`;
  const pts=["越稀有越难抽，重复卡自动分解返还点券。","十连保底至少 1 张超稀有(SR)。","累计消耗点券提升点券等级，解锁折扣等特权。",
    "集齐不同卡牌提升收藏等级。","达到点券等级里程碑可领取勋章奖励。","闪卡/彩虹/签名是同一张卡的稀有版本，收藏价值更高。"];
  h+=`<div style="font-size:13px;line-height:1.9">`;
  pts.forEach(p=> h+=`<div>• ${tr(p)}</div>`);
  h+=`</div>`;
  // rarity table
  h+=`<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">`;
  RARITIES.forEach(r=> h+=`<span class="rtag" style="background:${r.col}">${r.id} ${nm(r)} ${(r.p*100).toFixed(r.p<0.01?2:0)}%</span>`);
  h+=`</div>`;
  h+=`<div class="disc">${tr("点券为游戏内虚拟货币，不能兑换现实货币。")}<br>${tr("虚拟娱乐提示")}</div>`;
  byId("helpSheet").innerHTML=h;
}

function closeOv(id){ byId(id).classList.add("hidden"); }
function refreshOpen(){
  if(!byId("dexOv").classList.contains("hidden")) renderDex();
  if(!byId("lvOv").classList.contains("hidden")) renderLevels();
  if(!byId("medOv").classList.contains("hidden")) renderMedals();
}
function goHome(){ try{ if(window.parent!==window) window.parent.postMessage("leo-arcade-home","*"); }catch(e){} }

  try{ setInterval(()=>{ if(S) renderHud(); }, 1000); }catch(e){} }
init();

if(typeof window!=="undefined") window.__gacha={ get S(){return S;}, CARDS, RARITIES, drawOne, drawSingle, drawTen, pointLevel, uniqueOwned, fresh };
